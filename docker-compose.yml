version: '3.8'
services:
  db:
    image: postgres
    container_name: fp_planning_db_container
    restart: always
    environment:
      POSTGRES_DB: fp_planning_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
